<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject }}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f8fafc; margin: 0; padding: 0; }
    .container { max-width: 600px; margin: 0 auto; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    .header { background: linear-gradient(135deg, #0f172a, #1e2937); color: white; padding: 24px; text-align: center; }
    .content { padding: 24px; }
    .property-image { width: 100%; height: auto; border-radius: 8px; margin-bottom: 16px; display: block; }
    .price { font-size: 28px; font-weight: 700; color: #0f172a; margin: 8px 0; }
    .meta { color: #475569; font-size: 15px; line-height: 1.5; }
    .cta { display: inline-block; background: #0ea5e9; color: white; padding: 14px 28px; text-decoration: none; border-radius: 8px; font-weight: 600; margin: 20px 0; }
    .footer { font-size: 12px; color: #94a3b8; text-align: center; padding: 16px; border-top: 1px solid #e2e8f0; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1 style="margin:0; font-size:22px;">All Blue Property Alert</h1>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
    <div class="footer">
      You are receiving this because you saved a search alert on All Blue.<br>
      <a href="{{ unsubscribe_url or '#' }}" style="color:#64748b;">Manage alerts</a>
    </div>
  </div>
</body>
</html>
